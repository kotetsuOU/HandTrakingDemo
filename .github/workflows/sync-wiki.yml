name: Sync Wiki Documents

on:
  push:
    branches:
      - 3DDisplay
      - main
    paths:
      - "WIKI.md"
      - "Docs/POINTCLOUD_PIPELINE.md"
      - "Docs/OCCLUSION_RENDERING.md"
      - "Docs/HAPTICS.md"
      - "Docs/DEBUG_PCV.md"
      - "Docs/DISPLAY_3D.md"
      - "Docs/INITIALIZATION.md"
      - "Docs/AnimationControls.md"
      - "INITIALIZATION.md"

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v5

      - name: Sync to GitHub Wiki
        env:
          WIKI_REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: |
          # Wiki リポジトリを一時ディレクトリにクローン
          git clone "$WIKI_REPO" temp-wiki
          
          # ドキュメントを配置 (WIKI.md は Home.md として配置)
          cp WIKI.md temp-wiki/Home.md
          cp Docs/POINTCLOUD_PIPELINE.md temp-wiki/POINTCLOUD_PIPELINE.md
          cp Docs/OCCLUSION_RENDERING.md temp-wiki/OCCLUSION_RENDERING.md
          cp Docs/HAPTICS.md temp-wiki/HAPTICS.md
          cp Docs/DEBUG_PCV.md temp-wiki/DEBUG_PCV.md
          cp Docs/DISPLAY_3D.md temp-wiki/DISPLAY_3D.md
          cp Docs/INITIALIZATION.md temp-wiki/INITIALIZATION.md
          if [ -f Docs/AnimationControls.md ]; then
            cp Docs/AnimationControls.md temp-wiki/AnimationControls.md
          fi
          
          # リンクの書き換え処理 (ローカルの相対リンクを GitHub Wiki のフラットなリンク構造に変換)
          python3 -c '
          import os, re
          mapping = {
              "WIKI.md": "Home",
              "POINTCLOUD_PIPELINE.md": "POINTCLOUD_PIPELINE",
              "OCCLUSION_RENDERING.md": "OCCLUSION_RENDERING",
              "HAPTICS.md": "HAPTICS",
              "DEBUG_PCV.md": "DEBUG_PCV",
              "DISPLAY_3D.md": "DISPLAY_3D",
              "AnimationControls.md": "AnimationControls",
              "INITIALIZATION.md": "INITIALIZATION"
          }
          pattern = re.compile(r"\(\s*(?:\./)?([^/)]+\.md)\s*\)")
          def replace_link(match):
              filename = match.group(1)
              if filename in mapping:
                  return f"({mapping[filename]})"
              return match.group(0)
          
          for wiki_name in mapping.values():
              fpath = f"temp-wiki/{wiki_name}.md"
              if os.path.exists(fpath):
                  with open(fpath, "r", encoding="utf-8") as f:
                      content = f.read()
                  new_content = pattern.sub(replace_link, content)
                  with open(fpath, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print(f"Processed links in {fpath}")
          '
          
          # 変更の有無を確認してコミット・プッシュ
          cd temp-wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-sync wiki from main repository (${{ github.sha }})"
            git push origin HEAD
          else
            echo "No changes to sync."
          fi
